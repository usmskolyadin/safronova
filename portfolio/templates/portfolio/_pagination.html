{% if is_paginated %}
<div class="pagination">
  {% if page_obj.has_previous %}
    <a href="?page={{ page_obj.previous_page_number }}{% if selected_category %}&category={{ selected_category }}{% endif %}">&larr;</a>
  {% endif %}
  {% for num in paginator.page_range %}
    {% if num == page_obj.number %}
      <span class="is-current">{{ num }}</span>
    {% else %}
      <a href="?page={{ num }}{% if selected_category %}&category={{ selected_category }}{% endif %}">{{ num }}</a>
    {% endif %}
  {% endfor %}
  {% if page_obj.has_next %}
    <a href="?page={{ page_obj.next_page_number }}{% if selected_category %}&category={{ selected_category }}{% endif %}">&rarr;</a>
  {% endif %}
</div>
{% endif %}
